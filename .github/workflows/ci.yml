name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      # GitHub automatically downgrades write permissions to read-only on forked
      # pull_request runs, so untrusted code never receives write access.
      contents: write # Save coverage baseline on pushes to main
      pull-requests: write # Post/update coverage comment on same-repo PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Report coverage
        id: coverage_comment
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage comment artifact
        if: steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
